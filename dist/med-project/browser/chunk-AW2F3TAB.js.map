<div class="app-shell">

    <app-sidebar></app-sidebar>

    <main class="main-content">

        <app-toolbar></app-toolbar>

        <section class="page-container">

            <!-- Breadcrumb -->
            <div class="breadcrumb">
                <span>Home</span>
                <span class="breadcrumb-arrow">›</span>
                <span>Booking &amp; Appointment</span>
                <span class="breadcrumb-arrow">›</span>
                <span class="breadcrumb-current">{{ childTitle }}</span>

                <app-date-time></app-date-time>
            </div>

            <!-- =================================================
           TABS
           ================================================= -->
            <div class="tabs">

                <button class="tab" routerLink="/booking" routerLinkActive="active"
                    [routerLinkActiveOptions]="{ exact: true }">
                    <i class="material-icons">event_available</i>
                    Book Appointment
                </button>

                <button class="tab" routerLink="/booking/appointment-list" routerLinkActive="active">
                    <i class="material-icons">list_alt</i>
                    Appointment List
                </button>

            </div>

            <!-- =================================================
           ROUTED CONTENT
           ================================================= -->
            <router-outlet></router-outlet>

        </section>

    </main>

</div>
